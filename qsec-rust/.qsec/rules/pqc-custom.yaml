# ─────────────────────────────────────────────────────────────────────────────
# QSEC — Regras Customizadas PQC (OmniUil AI — Language Adapter)
# Arquivo: .qsec/rules/pqc-custom.yaml
#
# Estas regras complementam as 14 regras builtin do QSEC com detecções
# mais específicas para bibliotecas e frameworks comuns no Brasil.
#
# Formato suportado:
#   id:             Identificador único (ex: "CUSTOM-001")
#   severity:       CRITICAL | HIGH | MEDIUM | LOW
#   title:          Título curto (exibido no relatório)
#   description:    Explicação detalhada do problema
#   recommendation: Ação de correção específica
#   pattern:        Expressão regular (Rust regex syntax)
#   languages:      Lista de linguagens [python, java, go, etc.] — vazio = todas
#   taint_sink:     true = marca como sink para análise de taint
# ─────────────────────────────────────────────────────────────────────────────

rules:

  # ── Python — bibliotecas comuns no Brasil ──────────────────────────────────

  - id: "CUSTOM-PY-001"
    severity: "CRITICAL"
    title: "passlib com MD5 ou SHA-1 detectado"
    description: >
      passlib.hash.md5_crypt ou sha1_crypt usam algoritmos quebrados.
      Comum em sistemas legados Python/Django.
    recommendation: >
      Use passlib.hash.argon2 ou passlib.hash.bcrypt.
      Para novos sistemas: use hashlib.sha3_256 diretamente.
    pattern: "passlib\\.hash\\.(?:md5|sha1|des)_crypt|CryptContext.*(?:md5|sha1)_crypt"
    languages: ["python"]
    taint_sink: false

  - id: "CUSTOM-PY-002"
    severity: "HIGH"
    title: "Flask-JWT sem algoritmo explícito"
    description: >
      flask_jwt_extended sem especificação de JWT_ALGORITHM usa HS256 por padrão.
      HS256 usa HMAC simétrico — sem non-repudiation e vulnerável a quânticos.
    recommendation: >
      Configure JWT_ALGORITHM = 'EdDSA' no mínimo.
      Use QSEC PQC-JWT para conformidade CNSA 2.0.
    pattern: "flask_jwt_extended|from flask_jwt_extended import|JWT_SECRET_KEY\\s*="
    languages: ["python"]
    taint_sink: true

  - id: "CUSTOM-PY-003"
    severity: "MEDIUM"
    title: "Uso de secrets.token_hex sem tamanho suficiente"
    description: >
      secrets.token_hex(8) ou token_hex(4) gera apenas 64 ou 32 bits de entropia —
      insuficiente para chaves criptográficas (mínimo recomendado: 256 bits = 32 bytes).
    recommendation: >
      Use secrets.token_bytes(32) para 256 bits de entropia.
    pattern: "secrets\\.token_(?:hex|bytes|urlsafe)\\s*\\(\\s*(?:[0-9]|1[0-5])\\s*\\)"
    languages: ["python"]
    taint_sink: false

  # ── Java — Spring Security / Bouncy Castle ────────────────────────────────

  - id: "CUSTOM-JV-001"
    severity: "CRITICAL"
    title: "Spring Security com RSA ou ECDSA (JWT)"
    description: >
      RsaKeyConverts, RsaJwk ou JwtDecoder com RS256/RS384/RS512 usa RSA —
      vulnerável ao algoritmo de Shor em hardware quântico.
    recommendation: >
      Migre para EdDSA como primeiro passo, depois para ML-DSA via Bouncy Castle PQC.
    pattern: "RsaKeyConverts\\b|NimbusJwtDecoder\\.withPublicKey|RS(?:256|384|512)"
    languages: ["java"]
    taint_sink: true

  - id: "CUSTOM-JV-002"
    severity: "HIGH"
    title: "BCrypt com work factor baixo"
    description: >
      BCryptPasswordEncoder(strength) com strength < 12 pode ser
      quebrado por hardware moderno. Mínimo recomendado: 12.
    recommendation: >
      Use new BCryptPasswordEncoder(12) ou Argon2PasswordEncoder.
    pattern: "new\\s+BCryptPasswordEncoder\\s*\\(\\s*(?:[0-9]|1[01])\\s*\\)"
    languages: ["java"]
    taint_sink: false

  # ── Go — padrões comuns ───────────────────────────────────────────────────

  - id: "CUSTOM-GO-001"
    severity: "HIGH"
    title: "golang.org/x/crypto/bcrypt com custo baixo"
    description: >
      bcrypt.GenerateFromPassword com cost < 12 é insuficiente para
      proteção contra ataques de força bruta modernos.
    recommendation: >
      Use bcrypt.GenerateFromPassword(hash, 12) ou superior.
      Para novos sistemas, prefira argon2.IDKey do golang.org/x/crypto/argon2.
    pattern: "bcrypt\\.GenerateFromPassword\\s*\\([^,]+,\\s*(?:[0-9]|1[01])\\s*\\)"
    languages: ["go"]
    taint_sink: false

  # ── JavaScript / TypeScript ───────────────────────────────────────────────

  - id: "CUSTOM-JS-001"
    severity: "CRITICAL"
    title: "CryptoJS (biblioteca vulnerável) detectado"
    description: >
      CryptoJS usa implementações antigas de AES/MD5/SHA1/DES que não
      foram auditadas para uso em produção e têm vulnerabilidades conhecidas.
    recommendation: >
      Use a Web Crypto API nativa (crypto.subtle) ou libsodium.js.
    pattern: "require\\s*\\(['\"]crypto-js['\"]\\)|import.*from\\s*['\"]crypto-js['\"]|CryptoJS\\."
    languages: ["javascript", "typescript"]
    taint_sink: false

  - id: "CUSTOM-JS-002"
    severity: "HIGH"
    title: "jose / jsonwebtoken sem verificação de algoritmo"
    description: >
      jwt.verify() sem especificar algorithms: [] aceita qualquer algoritmo,
      incluindo 'none' — vulnerabilidade crítica de JWT.
    recommendation: >
      Sempre especifique: jwt.verify(token, secret, { algorithms: ['EdDSA'] }).
    pattern: "jwt\\.verify\\s*\\([^)]+\\)"
    languages: ["javascript", "typescript"]
    taint_sink: true

  # ── Rust — padrões específicos ────────────────────────────────────────────

  - id: "CUSTOM-RS-001"
    severity: "HIGH"
    title: "rand::thread_rng para geração de chaves"
    description: >
      thread_rng é adequado para simulações mas NÃO recomendado para
      material criptográfico — use OsRng explicitamente.
    recommendation: >
      Use rand_core::OsRng ou getrandom::getrandom() para bytes criptográficos.
    pattern: "thread_rng\\s*\\(\\)|rand::thread_rng"
    languages: ["rust"]
    taint_sink: false

  - id: "CUSTOM-RS-002"
    severity: "MEDIUM"
    title: "Uso de openssl crate sem configuração segura"
    description: >
      openssl bindings sem configuração explícita podem negociar
      TLS 1.0/1.1 ou usar algoritmos legados.
    recommendation: >
      Configure SslConnector com set_min_proto_version(Some(SslVersion::TLS1_3))
      e desabilite suites de cifras legadas explicitamente.
    pattern: "SslConnector::builder|SslMethod::tls\\b|SslContext::builder"
    languages: ["rust"]
    taint_sink: false

  - id: "QSC-100"
    severity: "CRITICAL"
    title: "Chave criptográfica hardcoded detectada"
    description: >
      Uma chave secreta (AES, HMAC, etc.) está embutida diretamente no código-fonte.
      Exemplo clássico: Apache Shiro 1.2.4 (CVE-2016-4437) com chave AES padrão.
    recommendation: >
      Armazene chaves em um cofre de segredos (Vault, AWS KMS, variáveis de ambiente seguras).
      Gere chaves aleatórias em tempo de execução.
    pattern: "static\\s+final\\s+byte\\s*\\[\\s*\\]\\s+[A-Z_]+\\s*=\\s*Base64\\.decode\\("
    languages: ["java"]
    taint_sink: false


  - id: "QSC-101"
    severity: "CRITICAL"
    title: "Uso de java.util.Random em contexto de segurança"
    description: >
      java.util.Random é previsível e não deve ser usado para gerar tokens,
      senhas, chaves ou qualquer material criptográfico.
    recommendation: >
      Use java.security.SecureRandom ou, preferencialmente, um gerador
      quântico-resistente se disponível.
    pattern: "new\\s+Random\\s*\\(|java\\.util\\.Random"
    languages: ["java"]
    taint_sink: true

  - id: "QSC-102"
    severity: "CRITICAL"
    title: "RSA com tamanho de chave inferior a 2048 bits"
    description: >
      Chaves RSA menores que 2048 bits são consideradas inseguras e
      podem ser quebradas por atacantes com recursos moderados.
    recommendation: >
      Use RSA com 3072 ou 4096 bits, ou migre para ECDSA/EdDSA.
    pattern: "KeyPairGenerator\\.getInstance\\(\"RSA\"\\).*initialize\\(\\s*(?:512|1024|2047)\\s*\\)"
    languages: ["java"]
    taint_sink: false

  - id: "QSC-103"
    severity: "CRITICAL"
    title: "AES em modo ECB ou sem modo explícito"
    description: >
      AES no modo ECB não oferece confidencialidade real (padrões
      repetidos permanecem visíveis). Usar "AES" sem especificar modo
      também leva ao ECB em muitos provedores.
    recommendation: >
      Use AES-GCM ou AES-CBC com padding PKCS5. Explicite o modo:
      Cipher.getInstance("AES/GCM/NoPadding").
    pattern: "Cipher\\.getInstance\\(\\s*\"AES(?:/ECB)?\\s*\"\\s*\\)|AES/ECB"
    languages: ["java"]
    taint_sink: false

  - id: "QSC-104"
    severity: "HIGH"
    title: "Protocolos TLS antigos (SSLv3, TLS 1.0, TLS 1.1)"
    description: >
      SSLv3, TLS 1.0 e TLS 1.1 são obsoletos e vulneráveis a ataques
      como POODLE e BEAST. Devem ser desabilitados.
    recommendation: >
      Use TLS 1.2 ou TLS 1.3 como mínimo. Configure o servidor/client
      para rejeitar versões anteriores.
    pattern: "SSLv3|TLSv1\\.0|TLSv1\\.1|SSLContext\\.getInstance\\(\\s*\"SSL\\s*\""
    languages: ["java"]
    taint_sink: false

  - id: "QSC-105"
    severity: "HIGH"
    title: "Uso de random module do Python para tokens/segredos"
    description: >
      A biblioteca random do Python é adequada para simulações, mas NÃO
      para gerar tokens, senhas ou segredos criptográficos.
    recommendation: >
      Use secrets.token_hex, secrets.token_bytes ou os.urandom para
      qualquer finalidade de segurança.
    pattern: "random\\.(?:random|randint|randrange|choice|sample)\\s*\\("
    languages: ["python"]
    taint_sink: false

  - id: "QSC-106"
    severity: "HIGH"
    title: "Uso de MD5 ou SHA-1 em Go"
    description: >
      Go ainda permite o uso de crypto/md5 e crypto/sha1, que são
      algoritmos quebrados para segurança.
    recommendation: >
      Use golang.org/x/crypto/sha3 ou blake2b para novos sistemas.
    pattern: "\"crypto/md5\"|\"crypto/sha1\"|md5\\.Sum|sha1\\.Sum"
    languages: ["go"]
    taint_sink: false

  - id: "QSC-107"
    severity: "HIGH"
    title: "Uso de MD5 ou SHA-1 em Rust"
    description: >
      Crates como md-5 e sha1 fornecem funções de hash quebradas,
      inadequadas para segurança.
    recommendation: >
      Use sha3 ou blake2 da crate digest.
    pattern: "Md5::digest|Sha1::digest|md5::Md5|sha1::Sha1"
    languages: ["rust"]
    taint_sink: false

  - id: "QSC-108"
    severity: "CRITICAL"
    title: "Possível segredo hardcoded (senha/chave em string)"
    description: >
      Strings longas com aparência de segredo (senha, token, chave)
      embutidas diretamente no código são um risco grave.
    recommendation: >
      Remova o segredo e use um cofre (Vault, AWS Secrets Manager,
      variáveis de ambiente). Revogue e rotacione qualquer segredo exposto.
    pattern: "(?:password|passwd|pwd|secret|token|api_key)\\s*=\\s*\"[^\"]{12,}\""
    languages: ["python", "java", "javascript", "typescript", "go", "rust"]
    taint_sink: false


  # ── Novas regras de alto valor (adicionadas em Aug 2026) ────────────────

  - id: "QSC-110"
    severity: "CRITICAL"
    title: "MessageDigest com MD5 ou SHA-1 em Java"
    description: >
      MessageDigest.getInstance("MD5") ou "SHA-1" usa algoritmos
      criptograficamente quebrados para hashing de segurança.
    recommendation: >
      Use MessageDigest.getInstance("SHA3-256") ou
      MessageDigest.getInstance("SHA-256") (apenas para compatibilidade).
    pattern: "MessageDigest\\.getInstance\\(\\s*\"(?:MD5|SHA-1|SHA1)\\s*\"\\s*\\)"
    languages: ["java"]
    taint_sink: true

  - id: "QSC-111"
    severity: "CRITICAL"
    title: "KeyStore do Java com senha padrão 'changeit'"
    description: >
      O uso da senha padrão "changeit" ao carregar um keystore é amplamente
      conhecido e permite que atacantes acessem chaves privadas se o
      arquivo do keystore for comprometido.
    recommendation: >
      Gere uma senha forte e armazene-a em um cofre de segredos.
      Nunca use "changeit" em produção.
    pattern: "KeyStore\\.load\\([^,]+,\\s*\"changeit\"\\.toCharArray\\(\\)"
    languages: ["java"]
    taint_sink: false

  - id: "QSC-112"
    severity: "HIGH"
    title: "Uso de SHA-1 em certificados ou assinaturas (Java)"
    description: >
      SHA1withRSA, SHA1withECDSA e outros usam SHA-1, que é vulnerável
      a ataques de colisão e não deve ser usado para assinaturas.
    recommendation: >
      Use SHA256withRSA, SHA256withECDSA, ou melhor, EdDSA ou RSA-PSS.
    pattern: "\"SHA1with(?:RSA|ECDSA|DSA)\""
    languages: ["java"]
    taint_sink: false

  - id: "QSC-113"
    severity: "CRITICAL"
    title: "Uso de System.Random (C#/.NET) para segurança"
    description: >
      System.Random é um gerador pseudoaleatório não criptográfico.
      Usá-lo para tokens, senhas ou chaves é perigoso.
    recommendation: >
      Use System.Security.Cryptography.RandomNumberGenerator ou
      System.Security.Cryptography.RNGCryptoServiceProvider.
    pattern: "new\\s+Random\\s*\\(|System\\.Random"
    languages: ["csharp"]
    taint_sink: false

  - id: "QSC-114"
    severity: "HIGH"
    title: "Math.random() em JavaScript para segurança"
    description: >
      Math.random() não é criptograficamente seguro. Não deve ser usado
      para gerar tokens, senhas ou qualquer material sensível.
    recommendation: >
      Use window.crypto.getRandomValues() ou uma biblioteca adequada
      (ex.: crypto-js, libsodium).
    pattern: "Math\\.random\\s*\\(\\s*\\)"
    languages: ["javascript", "typescript"]
    taint_sink: false


  - id: "QSC-116"
    severity: "CRITICAL"
    title: "Chave privada RSA embutida em código (PEM/DER)"
    description: >
      Blocos de chave privada (-----BEGIN PRIVATE KEY-----) ou
      strings base64 muito longas podem representar material
      criptográfico comprometido.
    recommendation: >
      Remova imediatamente do repositório e rotacione a chave.
      Use um cofre de segredos para armazenar chaves privadas.
    pattern: "-----BEGIN (?:RSA |EC |DSA )?PRIVATE KEY-----"
    languages: []
    taint_sink: false
