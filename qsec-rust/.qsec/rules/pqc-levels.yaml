rules:
  - id: QSC-200
    severity: HIGH
    title: AES-128 abaixo do nivel PQC minimo recomendado
    description: AES-128 oferece apenas 64 bits de seguranca contra ataques quanticos via Grover. NIST PQC Level 2 requer minimo AES-192 ou AES-256.
    recommendation: Migre para AES-256-GCM ou ChaCha20-Poly1305.
    pattern: 'AES_128|aes-128-|createCipheriv.*aes-128|AES\.new.*128'
    languages: [python, javascript, go, java]
    taint_sink: false

  - id: QSC-201
    severity: HIGH
    title: SHA-256 insuficiente para assinaturas PQC Level 2
    description: SHA-256 oferece apenas 128 bits de seguranca quantica. Para assinaturas digitais PQC Level 2, use SHA-384 ou SHA-512.
    recommendation: Use SHA-384 ou SHA-512 em contextos de assinatura digital.
    pattern: 'hashlib\.sha256\(\)|MessageDigest.*SHA-256|sha2\.New256\(\)|createHash.*sha256'
    languages: [python, java, go, javascript]
    taint_sink: false

  - id: QSC-300
    severity: MEDIUM
    title: ECDH P-256 nao atinge PQC Level 3
    description: P-256 e vulneravel ao algoritmo de Shor. Para PQC Level 3, use ML-KEM-768 ou hibrido X25519+ML-KEM-768.
    recommendation: Substitua ECDH P-256 por ML-KEM-768 (NIST FIPS 203 Level 3).
    pattern: 'P-256|secp256r1|prime256v1|NID_X9_62_prime256v1'
    languages: [python, java, go, javascript, csharp]
    taint_sink: false

  - id: QSC-301
    severity: MEDIUM
    title: RSA-2048 nao atinge PQC Level 3
    description: RSA-2048 e completamente vulneravel ao algoritmo de Shor. ML-KEM-768 equivale ao AES-192 contra ataques quanticos.
    recommendation: Substitua RSA-2048 por ML-KEM-768 ou ML-DSA-65.
    pattern: 'RSA\.generate\(2048|initialize\(2048|GenerateKey.*2048|RSA.*2048'
    languages: [python, java, go, rust]
    taint_sink: false

  - id: QSC-400
    severity: MEDIUM
    title: ECDH P-384 nao atinge PQC Level 4
    description: ECDH P-384 e vulneravel ao algoritmo de Shor. Para PQC Level 4, use ML-KEM-1024 ou hibrido X448+ML-KEM-1024.
    recommendation: Substitua P-384 por ML-KEM-1024 (NIST FIPS 203 Level 5).
    pattern: 'P-384|secp384r1|EC.*384'
    languages: [python, java, go, javascript, csharp]
    taint_sink: false

  - id: QSC-500
    severity: LOW
    title: RSA-4096 nao atinge PQC Level 5
    description: Mesmo RSA-4096 e vulneravel ao algoritmo de Shor. PQC Level 5 requer ML-KEM-1024 mais ML-DSA-87.
    recommendation: Substitua RSA-4096 por ML-KEM-1024 mais ML-DSA-87 (NIST FIPS 203/204 Level 5).
    pattern: 'RSA\.generate\(4096|initialize\(4096|GenerateKey.*4096'
    languages: [python, java, go, rust]
    taint_sink: false

  - id: QSC-205
    severity: LOW
    title: Considere SLH-DSA como assinatura alternativa (NIST FIPS 205)
    description: NIST FIPS 205 define SLH-DSA baseado em SPHINCS+. Recomendado como alternativa ao ML-DSA para diversidade de algoritmos em sistemas criticos de longa duracao.
    recommendation: Implemente SLH-DSA (SPHINCS+-SHAKE-256s) como algoritmo de assinatura alternativo ao ML-DSA-87.
    pattern: 'sphincs|slh.dsa|SphincsPlusSign|SPHINCS'
    languages: []
    taint_sink: false

  - id: QSC-206
    severity: LOW
    title: HQC como KEM backup ao ML-KEM (selecionado NIST mar/2025 - FIPS pendente 2027)
    description: "HQC selecionado NIST marco/2025 como KEM backup ao ML-KEM. ATENCAO: HQC e algoritmo SELECIONADO, nao FIPS final. Draft NIST previsto 2026, finalizacao 2027. Use ML-KEM-768/1024 (FIPS 203) como KEM primario."
    recommendation: "Use ML-KEM-1024 (FIPS 203 finalizado) como KEM primario obrigatorio. HQC somente como KEM secundario apos finalizacao do FIPS (prevista 2027)."
    pattern: 'HQC128|HQC192|HQC256|hamming.quasi.cyclic'
    languages: []
    taint_sink: false

  # ── Detecção de implementação híbrida PQC (POSITIVO — confirma migração) ──
  - id: "QSC-H001"
    severity: "LOW"
    title: "Implementação híbrida PQC detectada (POSITIVO)"
    description: >
      Implementação híbrida clássico+PQC detectada. Modo híbrido é a abordagem
      recomendada pelo NIST e NSA CNSA 2.0 durante a transição: combina algoritmo
      clássico (X25519, ECDH) com PQC (ML-KEM-768) para manter compatibilidade
      enquanto adiciona proteção quântica. Isto é um indicador POSITIVO de migração.
    recommendation: >
      Excelente — implementação híbrida é o caminho correto de migração.
      Target final: ML-KEM-1024 puro (FIPS 203 Level 5) após 2027.
      Verifique se está usando X25519Kyber768Draft00 ou ML-KEM-768 conforme IETF RFC draft.
    pattern: 'X25519Kyber768|x25519_kyber|kyber768.*x25519|ml.kem.*x25519|xwing|X25519\+|hybrid.*kem|HybridKEM|X25519MLKEM'
    languages: []
    pqc_level: 3
    taint_sink: false

  - id: "QSC-H002"
    severity: "LOW"
    title: "ML-KEM detectado (POSITIVO — algoritmo PQC aprovado)"
    description: >
      ML-KEM (Module-Lattice-Based Key-Encapsulation Mechanism) detectado —
      algoritmo PQC aprovado NIST FIPS 203. Indica que a migração PQC já está
      em andamento neste componente.
    recommendation: >
      Confirme que está usando ML-KEM-768 (Level 3) ou ML-KEM-1024 (Level 5)
      conforme exigido pelo CNSA 2.0. Evite ML-KEM-512 para sistemas NSS.
    pattern: 'ML.KEM|MLKEM|Kyber(?:512|768|1024)|kyber_(?:512|768|1024)|pqcrypto.*kyber|oqs.*kyber|liboqs.*kem'
    languages: []
    pqc_level: 5
    taint_sink: false

  - id: "QSC-H003"
    severity: "LOW"
    title: "ML-DSA detectado (POSITIVO — assinatura PQC aprovada)"
    description: >
      ML-DSA (Module-Lattice-Based Digital Signature Algorithm) detectado —
      algoritmo PQC aprovado NIST FIPS 204. Indica migração de assinaturas digitais.
    recommendation: >
      Confirme que está usando ML-DSA-65 (Level 3) ou ML-DSA-87 (Level 5)
      conforme exigido pelo CNSA 2.0 para sistemas NSS.
    pattern: 'ML.DSA|MLDSA|Dilithium(?:2|3|5)|dilithium_(?:2|3|5)|pqcrypto.*dilithium|oqs.*dilithium'
    languages: []
    pqc_level: 5
    taint_sink: false

  - id: QSC-H004
    title: "FN-DSA/FALCON detectado (FIPS 206 em desenvolvimento - nao finalizado set/2026)"
    severity: LOW
    description: "FN-DSA (FALCON) foi selecionado pelo NIST mas FIPS 206 ainda nao foi finalizado. Use ML-DSA-65/87 (FIPS 204 finalizado ago/2024) como algoritmo de assinatura primario."
    recommendation: "Use ML-DSA-65 ou ML-DSA-87 (FIPS 204) para assinaturas. Aguarde FIPS 206 antes de adotar FN-DSA em producao."
    pattern: 'falcon|fn.dsa|FALCON_(?:512|1024)|pqcrypto.*falcon|oqs.*falcon'
    languages: []
    pqc_level: 4
    taint_sink: false
