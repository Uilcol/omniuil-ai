# QSEC — Nginx proxy reverso
# Modo dev: HTTP simples
# Modo produção: descomente o bloco HTTPS abaixo

server {
    listen 80;
    server_name _;

    # Redireciona para HTTPS em produção
    # return 301 https://$host$request_uri;

    # Modo dev — proxy direto
    location / {
        proxy_pass         http://qsec-api:8080;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;

        # SSE — streaming de logs em tempo real
        proxy_buffering    off;
        proxy_cache        off;
    }
}

